# Réglages mesurés le 26/10 (mission build-speed) — un par un, gardés
# seulement s'ils gagnaient :
#  · org.gradle.parallel + org.gradle.caching : déjà là, ils payent (le cache
#    partagé sert 74 des 224 tâches du build complet).
#  · org.gradle.configuration-cache : REFUSÉ, il casse le build. app/build.gradle.kts
#    lance `git log/rev-list/rev-parse` à la configuration (versionCode/versionName) ;
#    Gradle refuse tout processus externe dans une entrée de cache de
#    configuration (« 3 problems were found storing the configuration cache »,
#    BUILD FAILED). À refaire seulement si ces appels passent par un ValueSource.
#  · Les runners partagent le serveur : plafond de deux workers par build,
#    au lieu des 80 annoncés dans le journal CI du 28/10. Un poste dédié peut
#    relever cette limite avec --max-workers, sans modifier ce fichier.
#  · kotlin.incremental : déjà le défaut de Kotlin 2.2, rien à ajouter.
#  · JVM : -Xmx2g (dans ci.yml) reste le meilleur mesuré. Un démon éphémère
#    par build évite de réutiliser celui d'un autre job sur le serveur partagé.
#    Les caches restent actifs ; un poste dédié peut choisir --daemon.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.workers.max=2
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# JDK : portabilite assuree par JAVA_HOME (17), pas par un chemin en dur.
# Sur un poste dont le `java` systeme est un JRE 21 sans javac, mettre
#   org.gradle.java.home=/chemin/vers/jdk17
# dans ~/.gradle/gradle.properties (perso, non versionne) — pas ici.
