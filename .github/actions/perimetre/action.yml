name: Périmètre code/backend
description: >-
  Détermine si la PR/push touche du code Gradle (code=1) et/ou du backend
  (backend=1). Source unique du pas « Cette PR touche-t-elle du code ? »
  (jobs ci-core et ci-app) : une seule implémentation, pas de copie.
inputs:
  github-token:
    description: Jeton GitHub (lecture de la liste des fichiers via l'API)
    required: true
  pr-number:
    description: Numéro de PR (événement pull_request, vide sinon)
    required: false
    default: ''
  push-before:
    description: SHA avant (événement push, vide sinon)
    required: false
    default: ''
  push-sha:
    description: SHA courant (événement push, vide sinon)
    required: false
    default: ''
  pr-head-ref:
    description: Branche tête de la PR (détection des lots Mergify)
    required: false
    default: ''
  pr-body:
    description: >-
      Corps de la PR. Sert uniquement sur une PR de lot Mergify : il porte le
      bloc machine `pull_requests:` qui donne la TAILLE du lot, donc si l'arbre
      testé est déjà celui d'une PR verte (lot de 1) ou une combinaison neuve.
    required: false
    default: ''
outputs:
  code:
    description: "'1' si Gradle doit tourner, '0' sinon"
    value: ${{ steps.perimetre.outputs.code }}
  backend:
    description: "'1' si les tests Python backend doivent tourner, '0' sinon"
    value: ${{ steps.perimetre.outputs.backend }}
runs:
  using: composite
  steps:
    - id: perimetre
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ inputs.pr-number }}
        PUSH_BEFORE: ${{ inputs.push-before }}
        PUSH_SHA: ${{ inputs.push-sha }}
        PR_HEAD_REF: ${{ inputs.pr-head-ref }}
        PR_BODY: ${{ inputs.pr-body }}
      run: |
        # Une PR de docs/config n'a pas besoin de Gradle : le verdict tombe en
        # quelques secondes. La liste des fichiers vient de l'API (le checkout
        # est superficiel, la base n'y est pas).
        code=1
        fichiers=""
        lot=0
        # PR de lot de la file de merge. Un lot d'UNE PR est l'arbre de cette
        # PR : Mergify la rebase sur `master` (`update_method: rebase`) et
        # reconstruit exactement le même contenu — la CI de la PR vient de
        # rendre son verdict sur cette tête. Rejouer Gradle ne teste donc rien
        # de neuf et coûte un créneau de runner entier pour un verdict connu :
        # on rend ce passage-ci vert en quelques secondes.
        # Un lot de DEUX PR ou plus, lui, teste une combinaison que personne
        # n'a vue (chaque PR n'a été vérifiée que seule sur `master`) : là, les
        # tests tournent pour de vrai.
        # Taille inconnue (bloc absent, script absent, corps vide) : on teste.
        # Défaut sûr, jamais l'inverse.
        case "${PR_HEAD_REF:-}" in
          mergify/merge-queue/*)
            lot_prs=$(printf '%s' "${PR_BODY:-}" \
              | python3 "$GITHUB_WORKSPACE/tools/mergify_batch_size.py" 2>/dev/null || echo 0)
            case "${lot_prs:-0}" in
              1)
                lot=1
                echo "Lot Mergify d'UNE PR : arbre identique à la tête déjà testée, étapes Gradle sautées."
                ;;
              0|'')
                echo "Taille du lot illisible : tests lancés (défaut sûr)."
                ;;
              *)
                echo "Lot Mergify de ${lot_prs} PR : combinaison jamais testée, tests lancés."
                ;;
            esac
            ;;
        esac
        if [ -n "$PR_NUMBER" ]; then
          fichiers="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" \
            | python3 -c 'import json,sys;print("\n".join(f["filename"] for f in json.load(sys.stdin)))' 2>/dev/null || true)"
        elif [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
          fichiers="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/compare/$PUSH_BEFORE...$PUSH_SHA" \
            | python3 -c 'import json,sys;print("\n".join(f["filename"] for f in json.load(sys.stdin).get("files") or []))' 2>/dev/null || true)"
        fi
        # Périmètre « code » : chaque module est nommé, et TOUT ce qui vit
        # sous un module compte (manifest, res/, schémas Room, règles
        # ProGuard) — pas seulement les .kt. Avant, un manifest ou un schéma
        # Room modifié passait pour « sans code » : Gradle ne tournait pas,
        # donc vert par absence de test. La doc (.md/.txt) reste hors
        # périmètre, où qu'elle soit. `tools/` n'y est pas : aucun test JVM
        # ne lit ces scripts (gardes CI + bancs manuels), une PR 100 %
        # Python n'a pas besoin de Gradle — les gardes tournent toujours.
        # `server/` a son propre verdict (`backend`) : tests Python, pas Gradle.
        backend=1
        if [ -n "$fichiers" ]; then
          if printf '%s\n' "$fichiers" | grep -vE '\.(md|txt)$' \
            | grep -qE '^(app|core)/|^gradle/|^gradle\.properties$|^settings\.gradle\.kts$|^build\.gradle\.kts$'; then
            code=1; echo "Code touché : Gradle complet."
          else
            code=0; echo "Sans code (${fichiers//$'\n'/, }) : étapes Gradle sautées."
          fi
          if printf '%s\n' "$fichiers" | grep -vE '\.(md|txt)$' | grep -qE '^server/'; then
            backend=1; echo "Backend touché : tests Python."
          else
            backend=0; echo "Backend intact : tests Python sautés."
          fi
        fi
        # Dernier mot pour un lot d'UNE PR : la liste de fichiers ci-dessus
        # verrait bien du code (le lot rebasé), mais c'est exactement la tête
        # déjà testée. Seul ce cas saute ; un lot de plusieurs PR garde son
        # verdict complet par l'arbre fusionné.
        if [ "$lot" = "1" ]; then code=0; backend=0; fi
        echo "code=$code" >> "$GITHUB_OUTPUT"
        echo "backend=$backend" >> "$GITHUB_OUTPUT"
