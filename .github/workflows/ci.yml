name: CI

# Budget : 5 min maximum PAR JOB (règle projet) — jamais allongé.
# Runners self-hosted (labels `self-hosted, linux, x64, vision`), cache Gradle
# chaud sur chaque machine : une VM éphémère repart à froid (3-4 min).
# Découpe v9 (2026-10-28) : la PR ne porte QUE le job `ci` (gardes + tests
# JVM) — verdict < 4 min, 1 runner par PR au lieu de 4. Les builds natifs
# (`apk`, `apk-release`, `lint`) sont vérifiés à chaque push sur master par
# `ci-native.yml` (même timeout). Motif : 4 jobs × N PRs saturaient les
# 19 runners — file jusqu'à 10 min, budget wall-clock cassé alors que chaque
# job tenait ses 5 min (mesuré le 28/10).
# Marge 5 min (2026-10-30) : `maxParallelForks = 2` (build.gradle.kts racine),
# `--max-workers=4` sur les appels CI (le plafond 2 de gradle.properties reste
# le défaut des builds partagés), `setup-gradle` après le périmètre (sauté sans
# code), roues pip en cache, upload scoping par module. `--offline` refusé :
# une PR ajoutant une dépendance verrait son build échouer au lieu de
# télécharger l'artefact absent du cache.
# Découpe v10 (2026-10-30) : le job `ci` unique est coupé en `ci-core`
# (gardes + backend + tests `:core`) et `ci-app` (tests `:app`), sous un
# agrégateur `ci` vert ssi les deux moitiés sont vertes — le check requis `ci`
# ne change pas (ni ruleset, ni Mergify, ni `green()` du balayeur). Motif : 4
# runs tués par le timeout à ~320 s en 48 h (Tests JVM à 277-280 s contre
# ~125 s en médiane, contention des runners partagés — cache Gradle restauré,
# zéro téléchargement) ; le parallélisme seul n'a pas sauvé le run du 30/10 au
# soir. Mesuré sur 48 h : file quasi nulle hors rafales du balayeur — +1 job
# par push coûte ~3 créneaux sur 21 au pire pic, contre un cycle complet perdu
# par kill. Verdict inchangé (mêmes gardes, mêmes tests).
on:
  pull_request:
  push:
    branches:
      - master
      # Branches de la file de merge Mergify (`mergify/merge-queue/...`) : la
      # file y pousse l'arbre fusionné du lot et attend les trois checks
      # requis. Sans ce déclencheur, le lot n'aurait jamais de verdict.
      - 'mergify/merge-queue/**'
  # File de merge native (29/10) : le groupe construit un commit temporaire
  # (`master` + les PR de la file) et rejoue **les mêmes** checks dessus.
  # Sans ce déclencheur, `ci` et `ci-budget` n'existent jamais sur
  # `gh-readonly-queue/**` et la file attendrait indéfiniment un verdict qui
  # n'arrive pas. Le pas « Cette PR touche-t-elle du code ? » retombe alors sur
  # `code=1` (aucune liste de fichiers) : dans la file, on teste toujours.
  merge_group:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # La détection « PR sans code » lit la liste des fichiers via l'API.
  pull-requests: read

# Présente dans chaque variante de l'APK, sans clé en clair dans Git.
env:
  GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}

jobs:
  # ── 1. moitié `:core` : gardes + backend + tests JVM ────────────────────────
  ci-core:
    name: ci-core
    runs-on: [self-hosted, linux, x64, vision]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Cette PR touche-t-elle du code ?
        id: perimetre
        uses: ./.github/actions/perimetre
        with:
          github-token: ${{ github.token }}
          pr-number: ${{ github.event.pull_request.number }}
          push-before: ${{ github.event.before }}
          push-sha: ${{ github.sha }}
          pr-head-ref: ${{ github.event.pull_request.head.ref }}

      # Cache Gradle : la VM est neuve à chaque job, sans lui 3-4 min à froid.
      # Après le périmètre : sans code, ni lecture ni écriture du cache.
      - uses: gradle/actions/setup-gradle@v4
        if: steps.perimetre.outputs.code == '1'
        with:
          cache-read-only: false

      # Chaîne d'outils + secrets + java.home + tailles Kotlin (action
      # composite partagée avec `ci-app` : un dépassement échoue vite des
      # deux côtés).
      - name: Gardes rapides
        uses: ./.github/actions/gardes-rapides

      # Les clés des APK distribués. Sans secret, l'APK sort sans clé (saisie
      # dans Réglages) : c'est le comportement par défaut d'un dépôt public.
      # Action composite : une seule implémentation pour les jobs qui bâtissent
      # (l'ancienne copie inline avait oublié `llm.live.api.key`).
      - name: Clés du build (secrets → local.properties)
        uses: ./.github/actions/cles-build
        with:
          llm-base-url: ${{ secrets.LLM_BASE_URL }}
          llm-api-key: ${{ secrets.LLM_API_KEY }}
          llm-model: ${{ secrets.LLM_MODEL }}
          tts-api-key: ${{ secrets.TTS_API_KEY }}
          tts-voice-id: ${{ secrets.TTS_VOICE_ID }}
          asr-api-key: ${{ secrets.ASR_API_KEY }}
          llm-live-api-key: ${{ secrets.LLM_LIVE_API_KEY }}

      # Le design Portrait est obligatoire (docs/ISEE-DESIGN-PORTRAIT.md) :
      # l'ancien design reste en quarantaine, le pane assemble la scène.
      - name: Garde du design Portrait (quarantaine ancien design)
        run: python3 tools/check-isee-design.py

      # Porte anti-dérive du budget de latence : un chiffre publié dans
      # docs/LATENCE-BUDGET.md doit être celui du code (voir la lane L23).
      # Quelques secondes, aucune compilation ; le document est écrit par la
      # mission du budget, la porte s'active à sa publication.
      - name: Porte anti-dérive du budget de latence (doc ↔ code)
        run: |
          python3 tools/check-budget-derive.py
          python3 -m unittest tools/test_check_budget_derive.py

      # Porte anti-dérive de la navigation vocale : les phrases, le catalogue
      # « en place » et les chiffres de docs/NAVIGATION-VOCALE.md doivent être
      # ceux du code. Quelques secondes, aucune compilation.
      - name: Porte anti-dérive navigation vocale (doc ↔ code)
        run: |
          python3 tools/check-voice-nav-doc.py
          python3 -m unittest tools/test_check_voice_nav_doc.py

      # La garde clés embarquées (`ci-native.yml`, job `apk`) a ses tests ici :
      # quelques secondes, aucune compilation, aucun réseau.
      - name: Tests de la garde clés embarquées
        run: python3 -m unittest tools/test_check_apk_keys.py

      # Les gardes de la CI se testent elles-mêmes : agents de conflit et de
      # périmètre, union des journaux, quota, couche0, budget — stdlib,
      # quelques secondes, aucun réseau.
      - name: Tests des gardes CI (conflits, périmètre, couche0, budget)
        run: |
          python3 .github/fireworks/test_conflict_agent.py
          python3 .github/fireworks/test_scope_agent.py
          python3 .github/fireworks/test_union_journal.py
          python3 .github/fireworks/test_quota.py
          python3 .github/couche0/test_check_couche0.py
          python3 .github/ci-budget/test_check_timeouts.py

      # Portes documentées mais jamais branchées : scripts shell, fixtures
      # dorées des masques, chiffres du budget, shader du suivi — secondes,
      # bibliothèque standard, aucun réseau, aucun appareil.
      - name: Portes Python et shell (scripts, goldens, budget, orb)
        run: |
          bash scripts/test_scripts.sh
          python3 scripts/gen_mask_golden.py --check
          python3 scripts/budget_latence.py --check-doc
          python3 tools/export-caregiver-orb.py --check
          python3 -m unittest tools/test_export_caregiver_orb.py

      # Tests du backend Python, seulement quand `server/` est touché. Les runners
      # self-hosted (Debian 13) n'ont ni pip, ni ensurepip, ni build setup-python
      # (« was not found for Debian 13 »), et pip refuse même `--user`
      # (externally-managed) : venv sans pip + get-pip.py dedans (jamais le
      # système).
      # Roues pip en cache (2026-10-30) : 15 s → ~4 s quand `server/` est
      # touché — le venv reste neuf à chaque run (isolation inchangée),
      # seules les roues sont réutilisées. Clé sur le hash des dépendances :
      # un requirements modifié invalide le cache tout seul.
      - name: Cache pip backend
        if: steps.perimetre.outputs.backend == '1'
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-backend-${{ hashFiles('server/scripts/requirements-test.txt') }}
      - name: Tests unitaires backend
        if: steps.perimetre.outputs.backend == '1'
        run: |
          VENV="$RUNNER_TEMP/venv-backend"
          python3 -m venv --without-pip "$VENV"
          curl -sS https://bootstrap.pypa.io/get-pip.py | "$VENV/bin/python" -
          "$VENV/bin/pip" install --quiet -r server/scripts/requirements-test.txt
          "$VENV/bin/python" server/scripts/test_units.py

      # Tests `:core` seuls : c'est la découpe v10 qui éloigne chaque moitié
      # du couperet de 300 s (voir l'en-tête). `--max-workers=4` : 4 ≈ part
      # équitable (21 runners / 80 cœurs), le plafond 2 de gradle.properties
      # restant le défaut hors CI. Rollback : retirer le flag.
      - name: Tests JVM (:core)
        if: steps.perimetre.outputs.code == '1'
        run: >-
          ./gradlew --console=plain -Dorg.gradle.jvmargs="-Xmx2g" --max-workers=4
          :core:testDebugUnitTest

      # Diagnostic des classes lentes : top 20 des suites JUnit déjà produites.
      # ~1 s, aucune compilation, lecture seule des XML, et ce pas ne fait
      # jamais échouer le job (tout échec de lecture est ignoré).
      - name: Top 20 des classes de test lentes
        if: steps.perimetre.outputs.code == '1'
        run: |
          python3 -c "
          import glob, xml.etree.ElementTree as X
          def secs(t):
              try:
                  return float(t.get('time') or 0)
              except (TypeError, ValueError):
                  return 0.0
          rows = []
          for f in glob.glob('*/build/test-results/testDebugUnitTest/*.xml'):
              try:
                  root = X.parse(f).getroot()
              except X.ParseError:
                  continue
              for t in root.iter('testsuite'):
                  rows.append((secs(t), t.get('name')))
          for d, n in sorted(rows, reverse=True)[:20]:
              print('%8.1fs  %s' % (d, n))"

      - name: Rapport de tests
        if: ${{ always() && steps.perimetre.outputs.code == '1' }}
        uses: actions/upload-artifact@v4
        with:
          name: rapports-tests-core
          path: core/build/reports/tests/**
          retention-days: 3
          compression-level: 1
          if-no-files-found: ignore

  # ── 2. moitié `:app` : tests JVM seuls ──────────────────────────────────────
  # Les gardes de propriété du commit (design, budget, voix, clés, gardes CI,
  # portes, backend) tournent dans `ci-core` sur le même commit : les rejouer
  # ici ne changerait pas le verdict. Seules les gardes rapides sont
  # dupliquées (même action composite) pour une rouge VITE des deux côtés.
  ci-app:
    name: ci-app
    runs-on: [self-hosted, linux, x64, vision]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Cette PR touche-t-elle du code ?
        id: perimetre
        uses: ./.github/actions/perimetre
        with:
          github-token: ${{ github.token }}
          pr-number: ${{ github.event.pull_request.number }}
          push-before: ${{ github.event.before }}
          push-sha: ${{ github.sha }}
          pr-head-ref: ${{ github.event.pull_request.head.ref }}

      - uses: gradle/actions/setup-gradle@v4
        if: steps.perimetre.outputs.code == '1'
        with:
          cache-read-only: false

      - name: Gardes rapides
        uses: ./.github/actions/gardes-rapides

      # Les tests `:app` lisent les clés via `BuildConfig` : sans cette étape,
      # ils tourneraient sans clé (verdict différent de la découpe v9).
      - name: Clés du build (secrets → local.properties)
        uses: ./.github/actions/cles-build
        with:
          llm-base-url: ${{ secrets.LLM_BASE_URL }}
          llm-api-key: ${{ secrets.LLM_API_KEY }}
          llm-model: ${{ secrets.LLM_MODEL }}
          tts-api-key: ${{ secrets.TTS_API_KEY }}
          tts-voice-id: ${{ secrets.TTS_VOICE_ID }}
          asr-api-key: ${{ secrets.ASR_API_KEY }}
          llm-live-api-key: ${{ secrets.LLM_LIVE_API_KEY }}

      - name: Tests JVM (:app)
        if: steps.perimetre.outputs.code == '1'
        run: >-
          ./gradlew --console=plain -Dorg.gradle.jvmargs="-Xmx2g" --max-workers=4
          :app:testDebugUnitTest

      - name: Top 20 des classes de test lentes
        if: steps.perimetre.outputs.code == '1'
        run: |
          python3 -c "
          import glob, xml.etree.ElementTree as X
          def secs(t):
              try:
                  return float(t.get('time') or 0)
              except (TypeError, ValueError):
                  return 0.0
          rows = []
          for f in glob.glob('*/build/test-results/testDebugUnitTest/*.xml'):
              try:
                  root = X.parse(f).getroot()
              except X.ParseError:
                  continue
              for t in root.iter('testsuite'):
                  rows.append((secs(t), t.get('name')))
          for d, n in sorted(rows, reverse=True)[:20]:
              print('%8.1fs  %s' % (d, n))"

      - name: Rapport de tests
        if: ${{ always() && steps.perimetre.outputs.code == '1' }}
        uses: actions/upload-artifact@v4
        with:
          name: rapports-tests-app
          path: app/build/reports/tests/**
          retention-days: 3
          compression-level: 1
          if-no-files-found: ignore

  # ── 3. le check exigé par la file : vert ssi les deux moitiés ──────────────
  # Le nom du check est celui du job : `ci` ne change pas — ni ruleset, ni
  # Mergify (`check-success = ci`), ni `green()` du balayeur. `if: always()`
  # + verdict explicite : sans ça, une moitié rouge rendrait ce job `skipped`
  # au lieu de rouge.
  ci:
    name: ci
    needs: [ci-core, ci-app]
    if: always()
    runs-on: [self-hosted, linux, x64, vision]
    timeout-minutes: 5
    steps:
      - name: Verdict (ci-core et ci-app verts)
        run: |
          [ "${{ needs.ci-core.result }}" = "success" ] || { echo "::error::ci-core : ${{ needs.ci-core.result }}"; exit 1; }
          [ "${{ needs.ci-app.result }}" = "success" ] || { echo "::error::ci-app : ${{ needs.ci-app.result }}"; exit 1; }
          echo "OK — ci-core et ci-app verts"

  # ── 4. garde-fou de configuration (ex-workflow ci-budget.yml) ───────────────
  # Fusionné ici le 29/10 : le check s'appelle toujours `ci-budget` (c'est le
  # nom du job qui nomme le check, pas le fichier), donc la protection de
  # `master` et la file de merge restent valides. Un run de moins par push de
  # PR (61/jour mesurés) et un seul verdict à lire.
  ci-budget:
    name: ci-budget
    runs-on: [self-hosted, linux, x64, vision]
    timeout-minutes: 5
    steps:
      - name: Checkout (superficiel)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Vérifier le budget de 5 min par job
        run: python3 .github/ci-budget/check_timeouts.py
