name: CI

# Budget : 5 min maximum PAR JOB (règle projet) — jamais allongé.
# Runners self-hosted (labels `self-hosted, linux, x64, vision`), cache Gradle
# chaud sur chaque machine : une VM éphémère repart à froid (3-4 min).
# Découpe v9 (2026-10-28) : la PR ne porte QUE le job `ci` (gardes + tests
# JVM) — verdict < 4 min, 1 runner par PR au lieu de 4. Les builds natifs
# (`apk`, `apk-release`, `lint`) sont vérifiés à chaque push sur master par
# `ci-native.yml` (même timeout). Motif : 4 jobs × N PRs saturaient les
# 19 runners — file jusqu'à 10 min, budget wall-clock cassé alors que chaque
# job tenait ses 5 min (mesuré le 28/10).
on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # La détection « PR sans code » lit la liste des fichiers via l'API.
  pull-requests: read

# Présente dans chaque variante de l'APK, sans clé en clair dans Git.
env:
  GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}

jobs:
  # ── 1. le check exigé par la file : les tests JVM ────────────────────────────
  ci:
    name: ci
    runs-on: [self-hosted, linux, x64, vision]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Cache Gradle : la VM est neuve à chaque job, sans lui 3-4 min à froid.
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Cette PR touche-t-elle du code ?
        id: perimetre
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          # Une PR de docs/config n'a pas besoin de Gradle : le verdict tombe en
          # quelques secondes. La liste des fichiers vient de l'API (le checkout
          # est superficiel, la base n'y est pas).
          code=1
          fichiers=""
          if [ -n "$PR_NUMBER" ]; then
            fichiers="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" \
              | python3 -c 'import json,sys;print("\n".join(f["filename"] for f in json.load(sys.stdin)))' 2>/dev/null || true)"
          elif [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            fichiers="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/compare/$PUSH_BEFORE...$PUSH_SHA" \
              | python3 -c 'import json,sys;print("\n".join(f["filename"] for f in json.load(sys.stdin).get("files") or []))' 2>/dev/null || true)"
          fi
          # Périmètre « code » : chaque module est nommé, et TOUT ce qui vit
          # sous un module compte (manifest, res/, schémas Room, règles
          # ProGuard) — pas seulement les .kt. Avant, un manifest ou un schéma
          # Room modifié passait pour « sans code » : Gradle ne tournait pas,
          # donc vert par absence de test. La doc (.md/.txt) reste hors
          # périmètre, où qu'elle soit.
          if [ -n "$fichiers" ]; then
            if printf '%s\n' "$fichiers" | grep -vE '\.(md|txt)$' \
              | grep -qE '^(app|core)/|^gradle/|^gradle\.properties$|^settings\.gradle\.kts$|^build\.gradle\.kts$|^tools/'; then
              code=1; echo "Code touché : Gradle complet."
            else
              code=0; echo "Sans code (${fichiers//$'\n'/, }) : étapes Gradle sautées."
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Chaîne d'outils
        run: |
          test -n "$JAVA_HOME" || { echo "::error::JAVA_HOME absent de l'image"; exit 1; }
          test -n "$ANDROID_HOME" || { echo "::error::ANDROID_HOME absent — installer le SDK Android"; exit 1; }
          "$JAVA_HOME/bin/java" -version
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Aucun secret ni fichier local dans le dépôt
        run: |
          # Régression déjà vue sur ce projet : des clés API en clair dans un
          # fichier de config. Ici on refuse tout ajout de ce genre.
          if git ls-files --error-unmatch local.properties >/dev/null 2>&1; then
            echo "::error::local.properties ne doit jamais être versionné (clés API)"; exit 1
          fi
          if git grep -nEI 'sk-[A-Za-z0-9_-]{24,}|sk_[a-f0-9]{32}|ghp_[A-Za-z0-9]{36}' -- . ':!.github' ':!docs' ':!*.md'; then
            echo "::error::clé API en clair détectée ci-dessus"; exit 1
          fi
          echo "OK — aucun secret versionné"

      - name: Anti-régression — pas de java.home codé en dur
        run: |
          # Déjà vu : org.gradle.java.home en dur dans gradle.properties casse
          # le build. La chaîne d'outils vient de l'environnement, jamais du dépôt.
          if grep -E '^[[:space:]]*org\.gradle\.java\.home' gradle.properties; then
            echo "::error::org.gradle.java.home ne doit pas être fixé dans gradle.properties"; exit 1
          fi
          echo "OK — java.home non codé en dur"

      # Les clés des APK distribués. Sans secret, l'APK sort sans clé (saisie
      # dans Réglages) : c'est le comportement par défaut d'un dépôt public.
      - name: Clés du build (secrets → local.properties)
        env:
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          TTS_API_KEY: ${{ secrets.TTS_API_KEY }}
          TTS_VOICE_ID: ${{ secrets.TTS_VOICE_ID }}
          ASR_API_KEY: ${{ secrets.ASR_API_KEY }}
          LLM_LIVE_API_KEY: ${{ secrets.LLM_LIVE_API_KEY }}
        run: |
          if [ -z "$LLM_API_KEY" ] && [ -z "$TTS_API_KEY" ] && [ -z "$ASR_API_KEY" ]; then
            echo "Aucun secret de clé : APK sans clé, saisie dans Réglages."
            exit 0
          fi
          : > local.properties
          for pair in "llm.base.url=$LLM_BASE_URL" "llm.api.key=$LLM_API_KEY" \
                      "llm.model=$LLM_MODEL" "llm.live.api.key=$LLM_LIVE_API_KEY" \
                      "tts.api.key=$TTS_API_KEY" \
                      "tts.voice.id=$TTS_VOICE_ID" "asr.api.key=$ASR_API_KEY"; do
            cle="${pair%%=*}"
            valeur="${pair#*=}"
            [ -n "$valeur" ] && printf '%s=%s\n' "$cle" "$valeur" >> local.properties
          done
          echo "local.properties écrit (gitignoré) : $(grep -c . local.properties) clé(s), valeurs jamais affichées."

      - name: Garde de taille Kotlin (< 500 lignes/fichier, < 50 lignes/fonction)
        run: python3 tools/check-kotlin-limits.py

      # Le design Portrait est obligatoire (docs/ISEE-DESIGN-PORTRAIT.md) :
      # l'ancien design reste en quarantaine, le pane assemble la scène.
      - name: Garde du design Portrait (quarantaine ancien design)
        run: python3 tools/check-isee-design.py

      # Porte anti-dérive du budget de latence : un chiffre publié dans
      # docs/LATENCE-BUDGET.md doit être celui du code (voir la lane L23).
      # Quelques secondes, aucune compilation ; le document est écrit par la
      # mission du budget, la porte s'active à sa publication.
      - name: Porte anti-dérive du budget de latence (doc ↔ code)
        run: |
          python3 tools/check-budget-derive.py
          python3 -m unittest tools/test_check_budget_derive.py

      # Un seul appel Gradle, mais SEULEMENT les tests : c'est ce job qui est
      # exigé par la file, il doit rendre son verdict vite.
      - name: Tests JVM (:core + :app)
        if: steps.perimetre.outputs.code == '1'
        run: >-
          ./gradlew --console=plain -Dorg.gradle.jvmargs="-Xmx2g"
          :core:testDebugUnitTest :app:testDebugUnitTest

      - name: Rapport de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-tests
          path: |
            **/build/reports/tests/**
          retention-days: 3
          if-no-files-found: ignore

