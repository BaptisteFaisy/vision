# pr-auto-merge — file de merge automatique : chaque PR interne prête est
# rebasée sur master si en retard (BEHIND) puis mergée (rebase) dès que les
# 6 checks requis sont verts. La seule porte reste la CI ; pas de gate humaine.
# v4 (2026-10-27) : vrai rebase (pas de bulle de merge) via PAT (secret
# AUTOMERGE_PAT) — GITHUB_TOKEN ne suffit pas (ni auto-merge, ni pushes qui
# relancent la CI : runs fantômes « action_required »). Sans le secret, pause
# propre au lieu d'échouer. Poussée avec bail (lease) : jamais d'écrasement
# d'un push d'auteur arrivé entre-temps. Brouillons et forks exclus.
# Conflits : on saute, l'auteur rebase à la main.
name: pr-auto-merge

on:
  pull_request:
    types: [opened, ready_for_review, reopened, synchronize]
  push:
    branches: [master]
  schedule:
    - cron: '*/10 * * * *'

concurrency:
  group: pr-auto-merge-queue
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sweep:
    runs-on: [self-hosted, linux, x64, vision]
    timeout-minutes: 5
    steps:
      - name: Balayer la file (rebase + merge)
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_PAT }}
          EVENT: ${{ github.event_name }}
        run: |
          green() { # 0 si les 6 checks requis de la PR $1 sont SUCCESS
            gh pr checks "$1" --json name,state 2>/dev/null | jq -e '
              ["ci","apk","apk-release","lint","ci-budget","couche0"] as $req |
              [ .[] | select(.name as $n | $req | index($n)) ] as $got |
              ($got | length == 6) and
              ([$got[] | select(.state == "SUCCESS")] | length == 6)
            ' >/dev/null
          }
          if [ -z "$GH_TOKEN" ]; then
            echo "AUTOMERGE_PAT absent : file en pause (voir l'en-tête du workflow)"
            exit 0
          fi
          if [ "$EVENT" = push ]; then
            sleep 60 # laisse GitHub recalculer les états après l'atterrissage
          fi
          rm -rf repo
          # Auth git via le helper gh (PAT dans GH_TOKEN), en one-shot : rien
          # n'est persisté dans la conf git du runner. http.extraHeader est
          # ignoré ici (prouvé : « invalid credentials » puis prompt).
          git -c credential.helper='!gh auth git-credential' clone --quiet \
            --filter=blob:none https://github.com/BaptisteFaisy/vision.git repo
          cd repo
          git config user.name "isee-automerge"
          git config user.email "isee-automerge@users.noreply.github.com"
          export GIT_EDITOR=true
          gh pr list --base master --state open \
            --json number,headRefOid,headRefName,mergeStateStatus,isDraft,headRepository \
            --jq '.[] | select(.headRepository.nameWithOwner == "BaptisteFaisy/vision")
              | select(.isDraft == false)
              | "\(.number) \(.headRefOid) \(.headRefName) \(.mergeStateStatus)"' \
          | while read -r pr sha branch state; do
            [ -n "$pr" ] || continue
            case "$state" in
              BEHIND)
                if git -c credential.helper='!gh auth git-credential' fetch -q origin "pull/$pr/head:pr-$pr" 2>/dev/null \
                  && git checkout -q "pr-$pr" 2>/dev/null \
                  && git rebase -q origin/master >/dev/null 2>&1; then
                  if git -c credential.helper='!gh auth git-credential' push -q --force-with-lease="$branch:$sha" origin "HEAD:$branch" 2>&1; then
                    echo "PR #$pr rebasée sur master"
                  else
                    echo "PR #$pr : a bougé entre-temps, prochain passage"
                  fi
                else
                  git rebase --abort >/dev/null 2>&1 || true
                  git checkout -q master 2>/dev/null || true
                  echo "PR #$pr sautée (conflit, à l'auteur de rebaser)"
                fi
                git branch -q -D "pr-$pr" >/dev/null 2>&1 || true
                ;;
              CLEAN)
                if green "$pr"; then
                  if gh pr merge --rebase --match-head-commit "$sha" "$pr" >/dev/null 2>&1; then
                    echo "PR #$pr mergée"
                  else
                    echo "PR #$pr : merge refusé (base bougée ?), prochain passage"
                  fi
                else
                  echo "PR #$pr : CI pas encore verte"
                fi
                ;;
              *) echo "PR #$pr : état $state, rien à faire" ;;
            esac
          done
