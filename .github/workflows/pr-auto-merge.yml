# pr-auto-merge — file de merge automatique : chaque PR interne est
# rebasée sur master si en retard (BEHIND) ou en conflit (DIRTY) ; les PR
# prêtes sont mergées (rebase) dès que les 3 checks requis sont verts.
# La seule porte reste la CI ; pas de gate humaine.
# v4 (2026-10-27) : vrai rebase (pas de bulle de merge) via PAT (secret
# AUTOMERGE_PAT) — GITHUB_TOKEN ne suffit pas (ni auto-merge, ni pushes qui
# relancent la CI : runs fantômes « action_required »). Sans le secret, pause
# propre au lieu d'échouer. Poussée avec bail (lease) : jamais d'écrasement
# d'un push d'auteur arrivé entre-temps. Forks exclus ; brouillons rebasés
# et réconciliés mais jamais mergés.
# Conflits (v5, 2026-10-28) : l'agent Fireworks tente de les résoudre
# (.github/fireworks/conflict_agent.py, modèle MiniMax M3.1 Flash) : résolution
# conflit par conflit, fin du rebase, push avec bail, compte rendu sur la PR.
# Sans le secret FIREWORKS_API_KEY, on saute comme avant et l'auteur rebase à
# la main. Coupe-circuit : variable de dépôt FIREWORKS_AGENT_RESOLVE=0.
# Conflits brouillons (v6, 2026-10-28) : le sweep traite aussi les brouillons
# (rebase + agent Fireworks) sans jamais les merger, et les DIRTY comme les
# BEHIND — la CI est la seule voie de résolution (plus de janitor local).
# Auth push (v7, 2026-10-28) : PAT dans l'URL (x-access-token) au lieu du
# helper gh, qui rend 403 « denied » sur les runners alors que l'API écrit.
# Parallèle (v8, 2026-10-28) : matrice — un job par PR (8 max), chacun avec
# son clone. Les runs restent sérialisés (groupe concurrency) ; dans un run,
# rebase + résolutions + merges avancent en parallèle. Échecs isolés
# (fail-fast: false), pushes toujours avec bail.
# Latence (v9, 2026-10-28) : le sweep part aussi à chaque fin de CI
# (`workflow_run` sur `CI`) au lieu d'attendre le cron 10 min (gardé en
# filet) ; le `sleep 60` devient un sondage borné 6 × 5 s ; `green()`
# n'exige plus que `ci`, `ci-budget` et `couche0` (le natif est vérifié sur
# master par `ci-native.yml`, protection réduite à ces 3 checks).
# Relance (v10, 2026-10-29) : `BLOCKED` n'est plus « rien à faire » — c'était
# le trou qui laissait une PR d'auteur pourrir indéfiniment (PR #215 de Gaïa :
# `couche0` rouge sur un `## Scope` absent, donc jamais relancée ni mergée).
# Désormais, pour une PR bloquée :
#   - checks `ci` / `ci-budget` tombés pour de l'infrastructure (job perdu,
#     checkout, cache, runner) → jobs en échec relancés, 2 fois max par tête,
#     marqueur en commentaire : jamais de boucle ;
#   - échec réel (étape de tests rouge) → aucune relance inutile, un
#     commentaire dit quelle étape est en cause, une fois par tête ;
#   - `couche0` rouge sur le périmètre → l'agent de périmètre
#     (.github/fireworks/scope_agent.py) rédige la déclaration manquante depuis
#     le diff et la vérifie avec le garde de master AVANT d'écrire le corps
#     (le garde n'est pas assoupli : fichier non déclaré et déclaration inutile
#     restent refusés) ; l'édition du corps relance `couche0` ;
#   - `UNKNOWN` : sondage borné (4 × 5 s) au lieu de rendre la main aussitôt.
#   `workflow_run` écoute aussi `couche0` pour enchaîner sans attendre le cron.
# Fluidité (v11, 2026-10-29) — mesuré sur 153 runs du 29/10 : 96 annulés (63 %),
# 92 déclenchés par `workflow_run` pour 52 push de PR, et le même couple
# (tête, base) balayé 3 fois (CI finie, couche0 fini, cron). Trois coupes :
#   - plus de déclencheur `pull_request` large : au push d'une PR, aucun check
#     n'existe encore, le balayage ne pouvait rien faire (matrice vide, run
#     brûlé). Reste `ready_for_review` (brouillon → prête : c'est le moment
#     où on veut merger) ;
#   - **un seul balayage par couple** (tête de PR, base, état de fusion,
#     empreinte des checks) :
#     une empreinte dans un commentaire unique, mis à jour sur place (pas un
#     commentaire par passage). Quand les checks passent, l'état change
#     (BLOCKED → CLEAN) — ou qu'un check change de verdict — et le balayage
#     suivant est un vrai travail ;
#   - cron de filet passé de 10 à 15 min : `workflow_run` reste la voie rapide,
#     et `ci-budget` a rejoint `ci.yml`, donc deux déclencheurs suffisent.
# Débit (v13, 2026-10-29) — la v12 a buté sur une règle du dépôt : le ruleset
# `master — PR obligatoire, checks requis` porte
# `strict_required_status_checks_policy: true`, donc GitHub **refuse** de merger
# une branche en retard (la protection classique, elle, dit `strict: false` :
# c'est le ruleset qui tranche). Conséquence : sous cette règle, chaque merge
# déplace `master` et invalide la CI de toutes les autres PR — le débit est
# plafonné à ~un merge par cycle de CI, quoi qu'on fasse. Deux corrections :
#   - le balayeur **arrête de rebaser tout le monde**. Avant, chaque mouvement
#     de `master` relançait un rebase + une CI pour *chaque* PR ouverte (O(N²)),
#     et aucune ne finissait avant le mouvement suivant. Désormais : s'il y a
#     une PR prête à être mergée, on merge et on ne rebase personne (ce serait
#     invalidé aussitôt) ; sinon on prépare **une seule** PR, la plus ancienne.
#   - le chemin « merge direct sans rebase » n'est armé que si le dépôt autorise
#     les branches en retard (`strict` lu à la source) — sinon il ne peut pas
#     aboutir et son échec ne servirait qu'à polluer le log.
# Mesure de départ : 15 merges/h, p90 création→merge 70 min.
# Débit (v12, 2026-10-29) — la demande est « plus de PR mergées par heure », pas
# « moins de runs ». Mesuré : 15 merges/h au mieux, p90 création→merge 70 min.
# La cause n'était pas la durée d'un balayage (17 s) mais le **rebase imposé** :
# chaque merge déplace `master`, donc les autres PR passent `BEHIND`, et le
# balayeur les rebasait une à une — chaque rebase poussait un commit, ce qui
# **relançait la CI de la PR** (≈ 60-90 s) et invalidait `master` à nouveau.
# Taxe en O(N²) sur le nombre de PR ouvertes.
#   - **Merge direct d'une PR `BEHIND`** dont les checks requis sont verts et
#     dont les fichiers ne croisent aucun fichier atterri depuis sa base : le
#     serveur rebase (`merge --rebase`, `strict: false` est déjà la politique
#     du dépôt), sans clone, sans push, **sans relancer la CI**. Si les
#     fichiers se croisent — ou au moindre doute — on rebase comme avant.
#   - Le groupe `concurrency` du workflow disparaît : il faisait « un run à la
#     fois » et GitHub **annule le run en attente** quand un nouveau arrive,
#     donc un « CI finie, merge-moi » pouvait être perdu et la PR attendait le
#     cron (c'était la queue p90). L'empreinte v11 est le vrai garde-fou : deux
#     runs qui prennent la même PR font la même chose, l'un des deux échoue
#     proprement (`--match-head-commit`).
#   - Cron de filet à 5 min (au lieu de 15) : avec `discover` seul (6 s) et la
#     déduplication, un réveil coûte quelques secondes.
# Journal (v11) : `CHANGELOG.md merge=union` — le journal est additif, la
# fusion garde les deux entrées au lieu de lever un conflit que l'agent devait
# résoudre à chaque mouvement de `master` (livelock observé : 6 réconciliations
# sur la même PR, un push par commit de `master`).

name: pr-auto-merge

on:
  # Uniquement les moments où le balayage peut *faire* quelque chose : les
  # événements `pull_request` larges (opened/synchronize/reopened) arrivaient
  # avant que le moindre check existe (52 runs/jour pour rien, mesuré le 29/10).
  pull_request:
    types: [ready_for_review]
  push:
    branches: [master]
  schedule:
    - cron: '*/5 * * * *'
  workflow_run:
    # `ci-budget` est un job de `CI` depuis le 29/10 : ces deux workflows
    # couvrent les trois checks requis.
    workflows: ["CI", "couche0"]
    types: [completed]

# Un groupe par **événement et par tête** (v12). Un groupe unique annulait le
# run *en attente* dès qu'un autre se déclenchait : le « CI verte, merge-moi »
# d'une PR était annulé par le run d'une autre, et la PR attendait le cron —
# c'était la queue p90. Deux têtes différentes ne s'annulent plus ; deux
# déclencheurs de la même tête (fin de `CI`, fin de `couche0`) restent un
# doublon que l'empreinte v11 déduplique de toute façon.
concurrency:
  group: pr-auto-merge-${{ github.event_name }}-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  discover:
    runs-on: [self-hosted, linux, x64, vision]
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
      strict: ${{ steps.build.outputs.strict }}
    steps:
      - name: Lister les PR internes ouvertes
        id: build
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_PAT }}
          EVENT: ${{ github.event_name }}
        run: |
          export PATH="$HOME/bin:/usr/local/bin:/usr/bin:$PATH" # gh + jq : r630 en espace user, runners Dell en système (127 vu 28/10 sur vision-3)
          if [ -z "$GH_TOKEN" ]; then
            echo "AUTOMERGE_PAT absent : file en pause (voir l'en-tête du workflow)"
            echo "matrix=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT" = push ]; then
            # Laisse GitHub recalculer les états après l'atterrissage :
            # sondage borné (6 × 5 s max, jamais de sleep fixe > 30 s).
            # On part dès que plus aucune PR n'est en état transitoire.
            for _ in 1 2 3; do
              inconnus="$(gh pr list --base master --state open \
                --json mergeStateStatus \
                --jq '[.[].mergeStateStatus] | map(select(. == "UNKNOWN")) | length' \
                2>/dev/null || echo 1)"
              [ "${inconnus:-1}" = "0" ] && break
              sleep 5
            done
          fi
          # Le dépôt exige-t-il une branche à jour avant merge ? La protection
          # classique et le ruleset peuvent diverger : on lit les deux, le
          # ruleset gagne (il est actif sur `master`).
          STRICT=$( { gh api "repos/$GITHUB_REPOSITORY/branches/master/protection" \
              --jq '.required_status_checks.strict' 2>/dev/null || echo false; } )
          RULESET=$( { gh api "repos/$GITHUB_REPOSITORY/rulesets" --jq '.[].id' 2>/dev/null || true; } )
          for rs in $RULESET; do
            s_rs=$(gh api "repos/$GITHUB_REPOSITORY/rulesets/$rs" 2>/dev/null \
              | jq -r '[.rules[]? | select(.type=="required_status_checks")
                        | .parameters.strict_required_status_checks_policy] | first // false' \
              2>/dev/null || echo false)
            [ "${s_rs:-false}" = "true" ] && STRICT=true
          done
          echo "strict=$STRICT"
          echo "strict=$STRICT" >> "$GITHUB_OUTPUT"
          MATRIX=$(gh pr list --base master --state open \
            --json number,headRefOid,headRefName,mergeStateStatus,isDraft,headRepository,baseRefOid,updatedAt \
            --jq '[.[] | select(.headRepository.nameWithOwner == "BaptisteFaisy/vision")
              | {pr: .number, sha: .headRefOid, branch: .headRefName,
                 state: .mergeStateStatus, draft: (.isDraft | tostring),
                 master: .baseRefOid, maj: .updatedAt}]
              | (map(select(.state == "CLEAN" and .draft == "false"))) as $pretes
              | if ($pretes | length) > 0 then
                  # Une PR est prête : on merge, et on ne rebase personne —
                  # ce merge déplace `master`, tout rebase serait perdu.
                  map(select(.state != "BEHIND"))
                else
                  # Rien à merger : on prépare UNE PR (la plus ancienne), pas
                  # toutes. Rebaser N PR d'un coup, c'est N CI relancées dont
                  # aucune ne finit avant le mouvement suivant de `master`.
                  map(select(.state != "BEHIND"))
                  + (map(select(.state == "BEHIND")) | sort_by(.maj) | .[0:1])
                end' \
            | jq -c .)
          [ -n "$MATRIX" ] || MATRIX="[]"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "$MATRIX" | jq -r '.[] | "PR #\(.pr) \(.state) (maj \(.maj))"'

  sweep:
    needs: discover
    if: ${{ needs.discover.outputs.matrix != '[]' && needs.discover.outputs.matrix != '' }}
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.matrix) }}
    runs-on: [self-hosted, linux, x64, vision]
    timeout-minutes: 5
    steps:
      - name: Rebase / résout / merge la PR ${{ matrix.pr }}
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_PAT }}
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
          FIREWORKS_MODEL: ${{ vars.FIREWORKS_MODEL }}
          FIREWORKS_AGENT_RESOLVE: ${{ vars.FIREWORKS_AGENT_RESOLVE }}
          FIREWORKS_AGENT_SCOPE: ${{ vars.FIREWORKS_AGENT_SCOPE }}
          REPO: BaptisteFaisy/vision
          PR: ${{ matrix.pr }}
          SHA: ${{ matrix.sha }}
          BRANCH: ${{ matrix.branch }}
          MASTER: ${{ matrix.master }}
          STATE: ${{ matrix.state }}
          DRAFT: ${{ matrix.draft }}
          STRICT: ${{ needs.discover.outputs.strict }}
        run: |
          export PATH="$HOME/bin:/usr/local/bin:/usr/bin:$PATH" # gh + jq : r630 en espace user, runners Dell en système (127 vu 28/10 sur vision-3)
          green() { # 0 si les 3 checks requis de la PR $1 sont SUCCESS
            gh pr checks "$1" --json name,state 2>/dev/null | jq -e '
              ["ci","ci-budget","couche0"] as $req |
              [ .[] | select(.name as $n | $req | index($n)) ] as $got |
              ($got | length == 3) and
              ([$got[] | select(.state == "SUCCESS")] | length == 3)
            ' >/dev/null
          }
          # ── état d'une PR bloquée ────────────────────────────────────────
          # `BLOCKED` était le trou de la v9 : le `case` ne le traitait pas,
          # donc la PR restait bloquée pour toujours (cas réel : #215).
          echecs_requis() { # noms des checks requis en échec, séparés par une espace
            gh pr checks "$1" --json name,bucket 2>/dev/null \
              | jq -r '[.[] | select(.bucket=="fail")
                        | .name | select(.=="ci" or .=="ci-budget" or .=="couche0")]
                       | join(" ")' || true
          }
          marques() { # $1=pr $2=marque → nb de commentaires qui portent la marque
            gh pr view "$1" --json comments --jq '.comments[].body' 2>/dev/null \
              | grep -cF -- "$2" || true
          }
          commente_une_fois() { # $1=pr $2=marque $3=corps (le corps porte la marque)
            [ "$(marques "$1" "$2")" -gt 0 ] && return 0
            gh pr comment "$1" --body "$3" >/dev/null 2>&1 || true
            return 0
          }
          etapes_cassees() { # $1=run id → étapes en échec (vide = job perdu)
            gh run view "$1" --json jobs --jq '
              [.jobs[] | select(.conclusion=="failure")
               | .steps[] | select(.conclusion=="failure") | .name] | join(" | ")' \
              2>/dev/null || true
          }
          # ── empreinte de balayage ───────────────────────────────────────
          # Les déclencheurs arrivent par rafales (fin de `CI`, fin de
          # `couche0`, cron) et refaisaient le même clone + le même rebase pour
          # rien : un couple (tête, base, état, empreinte des checks) n'est
          # balayé qu'une fois.
          # L'empreinte des checks est nécessaire : une PR est BLOCKED quand la
          # CI tourne *et* quand elle a échoué, or c'est exactement le passage
          # où il faut relancer. La signature (nom=état, triée) distingue les
          # deux, et un nouveau verdict change la clé.
          # Signature illisible → « indetermine » → jamais de déduplication.
          sig="$( { gh pr checks "$PR" --json name,state 2>/dev/null || true; } \
            | jq -er '[.[] | "\(.name)=\(.state)"] | sort | join(",")' 2>/dev/null || true )"
          PF="indetermine"
          if [ -n "${sig:-}" ]; then
            PF="$(printf '%s' "$sig" | sha1sum | cut -c1-10)"
          fi
          echo "empreinte checks : $PF"
          ETAT_MARQUE="<!-- automerge-etat -->"
          deja_balayee() {
            [ "$PF" = "indetermine" ] && return 1
            gh pr view "$PR" --json comments \
              --jq '[.comments[] | select(.body | startswith("<!-- automerge-etat -->"))]
                    | last | .body // ""' 2>/dev/null \
              | grep -qF "sha=$SHA master=$MASTER state=$STATE pf=$PF"
          }
          noter_etat() { # $1 = ce qui a été fait (une ligne)
            local cid corps
            cid=$(gh pr view "$PR" --json comments \
              --jq '[.comments[] | select(.body | startswith("<!-- automerge-etat -->"))]
                    | last | .id // ""' 2>/dev/null || true)
            corps=$(printf '%s\nsha=%s master=%s state=%s pf=%s\n\n%s' \
              "$ETAT_MARQUE" "$SHA" "$MASTER" "$STATE" "$PF" "$1")
            if [ -n "${cid:-}" ] && [ "$cid" != "null" ]; then
              gh api -X PATCH "repos/$REPO/issues/comments/$cid" \
                -f body="$corps" >/dev/null 2>&1 || true
            else
              gh pr comment "$PR" --body "$corps" >/dev/null 2>&1 || true
            fi
          }
          # ── fusion sans rebase ──────────────────────────────────────────
          # Une PR `BEHIND` peut être mergée telle quelle : `strict` est à
          # `false` dans la protection, et `merge --rebase` rebase côté serveur.
          # On ne le fait que si aucun fichier ne croise ce que `master` a pris
          # depuis la base de la PR : là où un rebase ne pourrait rien changer
          # au contenu, il ne sert qu'à relancer la CI (60-90 s par PR).
          recouvrement_fichiers() { # 0 = recouvrement (ou doute) → rebaser
            local pr_files master_files n
            pr_files=$(gh api "repos/$REPO/pulls/$PR/files?per_page=100" --paginate \
              --jq '.[].filename' 2>/dev/null | sort -u || true)
            master_files=$(gh api "repos/$REPO/compare/$MASTER...master" \
              --jq '.files[].filename' 2>/dev/null | sort -u || true)
            # Liste vide ou tronquée (l'API plafonne à 300 fichiers) : doute.
            [ -n "$pr_files" ] && [ -n "$master_files" ] || return 0
            n=$(printf '%s\n' "$master_files" | wc -l)
            [ "$n" -ge 300 ] && return 0
            comm -12 <(printf '%s\n' "$pr_files") \
                      <(printf '%s\n' "$master_files") | grep -q . && return 0
            return 1
          }
          ECHELLE_ETAPES=""
          relancer() { # $1=pr ; 0 = relancé, 1 = échec réel, 2 = rien à relancer
            local pr="$1" runs run sha_run etapes rc=2
            runs=$(gh pr checks "$pr" --json name,bucket,link 2>/dev/null \
              | jq -r '[.[] | select(.bucket=="fail")
                         | select(.name=="ci" or .name=="ci-budget") | .link][]
                       | select(. != null)' \
              | sed -n 's#.*/runs/\([0-9][0-9]*\).*#\1#p' | sort -u)
            [ -n "$runs" ] || return 2
            for run in $runs; do
              # Ne jamais relancer un run d'un autre commit : ça ne changerait
              # pas les checks de cette PR, ça brûlerait juste un runner.
              sha_run=$(gh run view "$run" --json headSha --jq .headSha 2>/dev/null || true)
              if [ "$sha_run" != "$SHA" ]; then
                echo "  run $run : autre commit, pas de relance"
                continue
              fi
              etapes=$(etapes_cassees "$run")
              # Panne d'infrastructure (runner perdu, checkout, cache) : relancer
              # est le bon geste. Test rouge : relancer ne prouve rien et brûle
              # le budget de 5 min par job — on le dit, une fois par tête.
              if [ -z "$etapes" ] || printf '%s' "$etapes" |
                   grep -qE 'Set up job|heckout|Setup Gradle|Post |Récupérer|cache|périmètre|chaîne d.outils'; then
                if gh run rerun "$run" --failed >/dev/null 2>&1; then
                  echo "  run $run relancé (panne d'infrastructure)"
                  rc=0
                else
                  echo "  run $run : relance refusée"
                fi
              else
                echo "  run $run : échec réel dans « $etapes », pas de relance"
                ECHELLE_ETAPES="$etapes"
                rc=1
              fi
            done
            return $rc
          }
          if deja_balayee; then
            echo "PR #$PR : balayée pour ${SHA:0:7} sur ${MASTER:0:7} en état $STATE (rien de neuf)"
            exit 0
          fi
          # ── chemin rapide : en retard sur la base, vert, fichiers disjoints ──
          # Aucun clone : c'est ce cas qui fait le débit. Chaque merge déplace
          # `master`, donc *toutes* les autres PR passent `BEHIND` ; les
          # rebaser une par une relançait leur CI et re-déplaçait `master`
          # (O(N²)). Ici on fusionne, point.
          if [ "${STRICT:-true}" != "true" ] && [ "$STATE" = "BEHIND" ] \
            && [ "$DRAFT" != "true" ] && green "$PR" && ! recouvrement_fichiers; then
            if err=$(gh pr merge --rebase --match-head-commit "$SHA" "$PR" 2>&1); then
              echo "PR #$PR mergée sans rebase (base en retard, fichiers disjoints)"
              noter_etat "mergée sans rebase : base en retard, fichiers disjoints, CI relancée pour rien évitée."
              exit 0
            fi
            echo "PR #$PR : merge direct refusé ($(printf '%s' "$err" | tail -1 | cut -c1-160)), on rebase"
          fi
          rm -rf repo
          # Auth git : PAT dans l'URL (x-access-token), passée par commande —
          # rien n'est persisté dans la conf git du runner. Le helper gh
          # ('!gh auth git-credential') rend 403 sur les runners (vu 28/10).
          AUTH_URL="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          git clone --quiet --filter=blob:none "$AUTH_URL" repo
          cd repo
          # Journal additif : `union` garde les deux entrées au lieu de lever
          # un conflit. Posé dans `info/attributes` et pas seulement dans
          # `.gitattributes` : une branche ancienne ne porte pas encore le
          # fichier, et c'est justement elle qui conflicte. Sans ça, chaque
          # mouvement de `master` relançait l'agent Fireworks sur CHANGELOG.md
          # → un push → une CI → un mouvement de `master` (livelock, 29/10).
          printf 'CHANGELOG.md merge=union\n' >> .git/info/attributes
          git config user.name "isee-automerge"
          git config user.email "isee-automerge@users.noreply.github.com"
          export GIT_EDITOR=true
          rebaser() { # rebase la PR sur master ; l'agent Fireworks résout les conflits
              if git fetch -q "$AUTH_URL" "pull/$PR/head:pr-$PR" 2>/dev/null \
                && git checkout -q "pr-$PR" 2>/dev/null \
                && git rebase -q origin/master >/dev/null 2>&1; then
                if git push -q --force-with-lease="$BRANCH:$SHA" "$AUTH_URL" "HEAD:$BRANCH" 2>&1; then
                  echo "PR #$PR rebasée sur master"
                else
                  echo "PR #$PR : a bougé entre-temps, prochain passage"
                fi
              else
                # Rebase en conflit : l'agent lit le script sur master (la
                # branche de la PR peut être antérieure), résout, termine
                # le rebase et pousse lui-même. 0 = poussé, 1 = échec avec
                # compte rendu, 2 = rien à faire : on saute sans bruit.
                rc=0 # "|| rc=$?" : le step tourne sous bash -e, sans ça
                # un exit != 0 de l'agent tuerait tout le sweep.
                git show origin/master:.github/fireworks/conflict_agent.py \
                  > /tmp/fw-agent.py 2>/dev/null \
                  && python3 /tmp/fw-agent.py resolve --repo "$REPO" \
                    --pr "$PR" --branch "$BRANCH" --sha "$SHA" || rc=$?
                git rebase --abort >/dev/null 2>&1 || true
                git checkout -q master 2>/dev/null || true
                case "$rc" in
                  0) echo "PR #$PR : conflit résolu par l'agent Fireworks" ;;
                  *) echo "PR #$PR sautée (conflit, à l'auteur de rebaser)" ;;
                esac
              fi
          }
          case "$STATE" in
            DIRTY) rebaser ;;
            # `BEHIND` : le chemin rapide a déjà dit non (fichiers qui se
            # croisent, brouillon, ou checks pas verts) → rebase classique.
            BEHIND) rebaser ;;
            CLEAN)
              if [ "$DRAFT" = "true" ]; then
                echo "PR #$PR : brouillon à jour, pas de merge"
              elif green "$PR"; then
                if gh pr merge --rebase --match-head-commit "$SHA" "$PR" >/dev/null 2>&1; then
                  echo "PR #$PR mergée"
                else
                  echo "PR #$PR : merge refusé (base bougée ?), prochain passage"
                fi
              else
                echo "PR #$PR : CI pas encore verte"
              fi
              ;;
            BLOCKED)
              echecs="$(echecs_requis "$PR")"
              if [ -z "${echecs:-}" ]; then
                echo "PR #$PR : BLOCKED sans check requis en échec (revue demandée ?), rien à faire"
              else
                echo "PR #$PR : BLOCKED — check(s) requis en échec : $echecs"
                case " $echecs " in
                  *" couche0 "*)
                    # Périmètre : une seule tentative par tête de PR.
                    if [ "$(marques "$PR" "<!-- automerge-scope sha=$SHA -->")" -eq 0 ]; then
                      rc=0
                      git show origin/master:.github/fireworks/scope_agent.py \
                        > /tmp/fw-scope.py 2>/dev/null \
                        && git show origin/master:.github/couche0/check_couche0.py \
                          > /tmp/couche0.py 2>/dev/null \
                        && python3 /tmp/fw-scope.py fix --repo "$REPO" --pr "$PR" \
                          --sha "$SHA" --guard /tmp/couche0.py || rc=$?
                      case "$rc" in
                        0) echo "PR #$PR : périmètre complété, couche0 va rejuger" ;;
                        2) echo "PR #$PR : périmètre laissé tel quel (rien de réparable ou déjà tenté)" ;;
                        *) echo "PR #$PR : périmètre non complété (code $rc)" ;;
                      esac
                    else
                      echo "PR #$PR : périmètre déjà traité pour ce SHA, pas de boucle"
                    fi
                    ;;
                esac
                case " $echecs " in
                  *" ci "*|*" ci-budget "*)
                    n="$(marques "$PR" "<!-- automerge-retry sha=$SHA -->")"
                    n="${n:-0}"
                    if [ "$n" -lt 2 ]; then
                      rc=0
                      relancer "$PR" || rc=$?
                      case "$rc" in
                        0)
                          printf -v corps '%s\n' \
                            "<!-- automerge-retry sha=$SHA -->" \
                            "Relance automatique ($((n + 1))/2) des checks requis en échec sur \`${SHA:0:7}\` — redémarrage des jobs, aucun nouveau commit."
                          gh pr comment "$PR" --body "$corps" >/dev/null 2>&1 || true
                          ;;
                        1)
                          printf -v corps '%s\n' \
                            "<!-- automerge-echec sha=$SHA -->" \
                            "Échec **réel** de la CI (étape « ${ECHELLE_ETAPES} ») : la file ne relance pas un test rouge, ça ne prouverait rien. Il faut un correctif, pas un re-run."
                          commente_une_fois "$PR" "<!-- automerge-echec sha=$SHA -->" "$corps"
                          ;;
                        *)
                          echo "PR #$PR : rien à relancer (run d'un autre commit ?)"
                          ;;
                      esac
                    else
                      echo "PR #$PR : 2 relances déjà faites pour ce SHA, on s'arrête là"
                    fi
                    ;;
                esac
              fi
              ;;
            UNKNOWN)
              # GitHub recalcule souvent en quelques secondes : sondage borné.
              st="$STATE"
              for _ in 1 2; do
                sleep 5
                st="$(gh pr view "$PR" --json mergeStateStatus --jq .mergeStateStatus 2>/dev/null || echo UNKNOWN)"
                [ "${st:-UNKNOWN}" != "UNKNOWN" ] && break
              done
              echo "PR #$PR : état $st après sondage, prochain passage"
              ;;
            *) echo "PR #$PR : état $STATE, rien à faire" ;;
          esac
          noter_etat "état \`$STATE\` · tête \`${SHA:0:7}\` · base \`${MASTER:0:7}\` — balayée, prochain passage au prochain changement." 