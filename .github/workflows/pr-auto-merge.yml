# pr-auto-merge — toute PR du dépôt part en auto-merge (rebase) dès sa
# création : la seule porte reste la CI (les 6 checks requis sur master).
# Brouillons exclus (armé à ready_for_review), forks exclus (PR internes
# seules : le job ne tourne que si head et base sont ce dépôt). Pas de
# déclencheur sur synchronize : un humain qui coupe l'auto-merge reste coupé.
# Posé le 2026-10-27 sur demande : « toutes les modifs passent en PR + merge
# auto ». Repli si GITHUB_TOKEN ne suffit plus : PAT dans un secret.
# Second job (push sur master) : met à jour les PR armées en retard, sinon
# la file se bloque dès que deux PR se suivent (BEHIND ne merge jamais).
name: pr-auto-merge

on:
  pull_request:
    types: [opened, ready_for_review, reopened]
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  pull-requests: write

jobs:
  arm:
    runs-on: [self-hosted, linux, x64, vision]
    timeout-minutes: 5
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    steps:
      - name: Armer l'auto-merge (rebase)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          armed="$(gh pr view "$PR_URL" --json autoMergeRequest -q '.autoMergeRequest.mergeMethod // empty')"
          if [ -n "$armed" ]; then
            echo "déjà armé ($armed), rien à faire"
          else
            gh pr merge --auto --rebase "$PR_URL"
            echo "auto-merge armé (rebase) sur $PR_URL"
          fi

  update-stale:
    # À chaque atterrissage sur master : remet à jour les PR armées en
    # retard (BEHIND), sinon elles restent bloquées et la file ne se vide
    # jamais. Seules les PR déjà en auto-merge (un humain qui a coupé reste
    # coupé), jamais les brouillons. Conflits (DIRTY) : on saute, l'auteur
    # rebase à la main.
    runs-on: [self-hosted, linux, x64, vision]
    timeout-minutes: 5
    if: github.event_name == 'push'
    steps:
      - name: Mettre à jour les PR armées en retard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr list --base master --state open \
            --json number,mergeStateStatus,autoMergeRequest,isDraft \
            --jq '.[] | select(.mergeStateStatus == "BEHIND") | select(.autoMergeRequest != null) | select(.isDraft == false) | .number' \
          | while read -r pr; do
            [ -n "$pr" ] || continue
            if gh pr update-branch "$pr" 2>&1; then
              echo "PR #$pr mise à jour"
            else
              echo "PR #$pr sautée (conflit probable, à l'auteur de rebaser)"
            fi
          done
