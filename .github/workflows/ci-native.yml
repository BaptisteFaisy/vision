name: CI native (hors PR)

# Builds natifs sortis des PR (découpe v9, 2026-10-28) : `apk`, `apk-release`
# et `lint` tournaient sur chaque PR et saturaient les 19 runners à 4 jobs
# par PR — file jusqu'à 10 min, budget wall-clock cassé alors que chaque job
# tenait ses 5 min (mesuré le 28/10). La PR ne porte plus que le job `ci`
# (gardes + tests JVM) ; ce workflow vérifie le natif à chaque push sur
# master, à chaque tag et sur demande manuelle.
# Timeout 10 min par job (clause CI-BUDGET-5MIN « job réellement plus long
# hors PR », justification exigée — la voici) : à cache Gradle froid, le
# setup + lintDebug/assemble dépassent 5 min (vu le 28/10 : 1er run sur
# master tué à 5 min, cache du nouveau workflow vide) ; à chaud, mesuré
# ≤ 4m45. Pas de budget 5 min imposé hors PR, mais timeout explicite.
on:
  push:
    branches: [master]
    tags: ['*']
  workflow_dispatch: {}

concurrency:
  group: ci-native-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Présente dans chaque variante de l'APK, sans clé en clair dans Git.
env:
  GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}

jobs:
  # ── APK debug ─────────────────────────────────────────────────────────────
  # Un job par APK : les deux variantes dans le même job ne tenaient pas dans
  # les 5 minutes (mesuré le 26/10 : coupé au budget). Deux VM = deux budgets.
  apk:
    name: apk
    runs-on: [self-hosted, linux, x64, vision]
    timeout-minutes: 10 # hors PR : cache froid possible (voir en-tête)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: gradle/actions/setup-gradle@v4
      # Les clés des APK distribués (même étape que le job `ci`) : sans elle,
      # l'artefact apk-debug sort sans clé et l'app dit « No LLM key
      # configured ». Sans secret, l'APK sort sans clé (saisie dans Réglages).
      - name: Clés du build (secrets → local.properties)
        env:
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          TTS_API_KEY: ${{ secrets.TTS_API_KEY }}
          TTS_VOICE_ID: ${{ secrets.TTS_VOICE_ID }}
          ASR_API_KEY: ${{ secrets.ASR_API_KEY }}
          LLM_LIVE_API_KEY: ${{ secrets.LLM_LIVE_API_KEY }}
        run: |
          if [ -z "$LLM_API_KEY" ] && [ -z "$TTS_API_KEY" ] && [ -z "$ASR_API_KEY" ]; then
            echo "Aucun secret de clé : APK sans clé, saisie dans Réglages."
            exit 0
          fi
          : > local.properties
          for pair in "llm.base.url=$LLM_BASE_URL" "llm.api.key=$LLM_API_KEY" \
                      "llm.model=$LLM_MODEL" "llm.live.api.key=$LLM_LIVE_API_KEY" \
                      "tts.api.key=$TTS_API_KEY" \
                      "tts.voice.id=$TTS_VOICE_ID" "asr.api.key=$ASR_API_KEY"; do
            cle="${pair%%=*}"
            valeur="${pair#*=}"
            [ -n "$valeur" ] && printf '%s=%s\n' "$cle" "$valeur" >> local.properties
          done
          echo "local.properties écrit (gitignoré) : $(grep -c . local.properties) clé(s), valeurs jamais affichées."
      - name: APK debug
        run: ./gradlew --console=plain -Dorg.gradle.jvmargs="-Xmx2g" :app:assembleDebug
      # Garde clés embarquées : tant que les secrets existent, l'APK DOIT les
      # contenir et la clé LLM DOIT répondre — sinon build rouge (déjà vu :
      # secrets restés sur l'ancien fournisseur, APK sans clé valide). Sans
      # secret, comportement inchangé (APK sans clé). Aucune valeur affichée.
      - name: Garde clés embarquées (dex + ping LLM)
        env:
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: python3 tools/check-apk-keys.py
      # L'APK du téléphone, publié à chaque push sur master.
      - name: APK debug sur master
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 2
          if-no-files-found: error

  # ── APK release — compile la variante release (R8 désactivé) ───────────────
  apk-release:
    name: apk-release
    runs-on: [self-hosted, linux, x64, vision]
    timeout-minutes: 10 # hors PR : cache froid possible (voir en-tête)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: gradle/actions/setup-gradle@v4
      # Les clés des APK distribués (même étape que le job `apk`) : sans elle,
      # la variante release sort sans clé alors que la debug les embarque.
      # Sans secret, l'APK sort sans clé (saisie dans Réglages).
      - name: Clés du build (secrets → local.properties)
        env:
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          TTS_API_KEY: ${{ secrets.TTS_API_KEY }}
          TTS_VOICE_ID: ${{ secrets.TTS_VOICE_ID }}
          ASR_API_KEY: ${{ secrets.ASR_API_KEY }}
          LLM_LIVE_API_KEY: ${{ secrets.LLM_LIVE_API_KEY }}
        run: |
          if [ -z "$LLM_API_KEY" ] && [ -z "$TTS_API_KEY" ] && [ -z "$ASR_API_KEY" ]; then
            echo "Aucun secret de clé : APK sans clé, saisie dans Réglages."
            exit 0
          fi
          : > local.properties
          for pair in "llm.base.url=$LLM_BASE_URL" "llm.api.key=$LLM_API_KEY" \
                      "llm.model=$LLM_MODEL" "llm.live.api.key=$LLM_LIVE_API_KEY" \
                      "tts.api.key=$TTS_API_KEY" \
                      "tts.voice.id=$TTS_VOICE_ID" "asr.api.key=$ASR_API_KEY"; do
            cle="${pair%%=*}"
            valeur="${pair#*=}"
            [ -n "$valeur" ] && printf '%s=%s\n' "$cle" "$valeur" >> local.properties
          done
          echo "local.properties écrit (gitignoré) : $(grep -c . local.properties) clé(s), valeurs jamais affichées."
      - name: APK release
        run: ./gradlew --console=plain -Dorg.gradle.jvmargs="-Xmx2g" :app:assembleRelease
      # Garde clés embarquées (même étape que le job `apk`) : l'APK DOIT
      # contenir la clé du secret et elle DOIT répondre — sinon build rouge.
      - name: Garde clés embarquées (dex + ping LLM)
        env:
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: python3 tools/check-apk-keys.py

  # ── lint — le poste le plus cher, donc sa propre VM ─────────────────────────
  lint:
    name: lint
    runs-on: [self-hosted, linux, x64, vision]
    timeout-minutes: 10 # hors PR : cache froid possible (voir en-tête)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: gradle/actions/setup-gradle@v4
      # C'est CE job qui porte le contrôle lint (abortOnError = true : une
      # erreur échoue ici). Le job `apk-release` n'a plus à le refaire :
      # `checkReleaseBuilds` est coupé en CI seulement (build.gradle.kts, racine),
      # parce que ce lint-ci analyse déjà les mêmes sources avec les mêmes
      # règles. Mesuré le 26/10 : 85 → 65 tâches sur `assembleRelease`,
      # 17 s → 14 s, APK release toujours produit.
      - name: lintDebug
        run: ./gradlew --console=plain -Dorg.gradle.jvmargs="-Xmx2g" :app:lintDebug
      - name: Rapport de lint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-lint
          path: '**/build/reports/lint-results-*.html'
          retention-days: 3
          if-no-files-found: ignore
