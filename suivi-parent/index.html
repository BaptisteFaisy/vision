<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>iSee</title>
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
  <script defer src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script type="module" src="./live.mjs"></script>
</head>
<body>
  <div class="app">
    <header>
      <button id="settings-button" type="button" aria-label="Paramètres">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9.5 3-.7 2.1-2 .9-2-.5-2 3.5 1.5 1.6v2.8L2.8 15l2 3.5 2-.5 2 .9.7 2.1h5l.7-2.1 2-.9 2 .5 2-3.5-1.5-1.6v-2.8L21.2 9l-2-3.5-2 .5-2-.9-.7-2.1z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
      <div class="topline" role="status"><span class="live-dot offline" id="dot"></span><span class="pill grey" id="live-badge">OFFLINE</span></div>
    </header>
    <main>
      <section class="scene" aria-label="Description de la session partagée">
        <div class="orb-frame" aria-hidden="true"><canvas id="orb"></canvas></div>
        <div class="spoken" hidden><div id="speaker">ISEE</div><p id="spoken-line" aria-live="polite" aria-atomic="true"></p></div>
      </section>
      <section id="map-wrap" aria-label="Carte des objets détectés">
        <div id="map" role="region" aria-label="Position et objets du téléphone partagé" aria-busy="true"></div>
        <p id="map-loading" role="status">Chargement de la carte…</p>
        <button id="recenter" type="button" aria-label="Recentrer la carte">↗</button>
        <p id="credit">© OpenStreetMap contributors · OpenFreeMap · Esri</p>
      </section>
    </main>
  </div>
  <dialog id="settings-dialog" aria-labelledby="settings-title">
    <div class="settings-heading"><h1 id="settings-title">Paramètres</h1><button id="close-settings" type="button" aria-label="Fermer les paramètres">×</button></div>
    <form id="shared-link-form">
      <label for="shared-link">Lien reçu de ton proche</label>
      <div class="input-row"><input id="shared-link" type="url" required autocomplete="off" placeholder="Colle le lien partagé"><button type="submit">Suivre</button></div>
    </form>
    <label for="gkey">Clé API Google Maps</label>
    <div class="input-row" id="keybox"><input id="gkey" type="password" autocomplete="off"><button id="savekey" type="button">Enregistrer</button><button id="clearkey" type="button" aria-label="Oublier la clé" hidden>×</button></div>
    <p id="map-provider" role="status"></p><p id="gerr" role="status" hidden></p>
    <div class="styles"><button data-s="hybrid" type="button">Hybride</button><button data-s="satellite" type="button">Satellite</button><button data-s="plan" type="button" class="on">Plan</button><button data-s="terrain" type="button">Terrain</button></div>
  </dialog>
</body>
</html>
