# sécurité obligatoire du 29/10/2026 (avec le SDK 1.0.0, les lunettes coupent chaque session
# pendant le handshake — SESSION_ENDED_BY_DEVICE sans jamais STARTED, mesuré le 04/11/2026).
# Le pin suit le runtime : 1.0.0 allait avec le runtime 1.0.0.0.0 (27/10/2026).
# Garde : DatPinTest.
mwdat = "1.0.1"
guava = "33.3.1-android"

