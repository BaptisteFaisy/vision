[versions]
agp = "8.11.1"
kotlin = "2.2.21"
coreKtx = "1.18.0"
coroutines = "1.10.2"
okhttp = "4.12.0"
composeBom = "2026.05.01"
activityCompose = "1.13.0"
lifecycle = "2.10.0"
camera = "1.6.0"
securityCrypto = "1.1.0"
room = "2.8.5"
work = "2.12.0"
ksp = "2.2.21-2.0.5"
testExtJunit = "1.3.0"
testCore = "1.7.0"
testRunner = "1.7.0"
junit = "4.13.2"
jump3r = "1.0.4"
json = "20240303"
# Runtime DAT réellement installé sur les Ray-Ban Meta : 1.0.0.0.0 (mesuré le 27/10/2026,
# Meta AI → Paramètres → Informations sur l'application). Le SDK 1.0.1 exige 1.0.1.1.0 :
# la session s'ouvre puis les lunettes la coupent aussitôt (« Your glasses need an update »,
# START_ERROR_DAT_APP_ON_THE_GLASSES_UPDATE_REQUIRED, absent du SDK 1.0.0). Garde : DatPinTest.
mwdat = "1.0.0"
guava = "33.3.1-android"
onnxAndroid = "1.18.0"
litert = "2.17.0"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-security-crypto = { module = "androidx.security:security-crypto", version.ref = "securityCrypto" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-camera-core = { module = "androidx.camera:camera-core", version.ref = "camera" }
androidx-camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camera" }
androidx-camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camera" }
androidx-camera-view = { module = "androidx.camera:camera-view", version.ref = "camera" }
androidx-camera-video = { module = "androidx.camera:camera-video", version.ref = "camera" }
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "testExtJunit" }
androidx-test-core = { module = "androidx.test:core", version.ref = "testCore" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "testRunner" }
androidx-test-rules = { module = "androidx.test:rules", version.ref = "testRunner" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
jump3r = { module = "de.sciss:jump3r", version.ref = "jump3r" }
junit = { module = "junit:junit", version.ref = "junit" }
json = { module = "org.json:json", version.ref = "json" }
mwdat-core = { module = "com.meta.wearable:mwdat-core", version.ref = "mwdat" }
mwdat-camera = { module = "com.meta.wearable:mwdat-camera", version.ref = "mwdat" }
mwdat-inputs = { module = "com.meta.wearable:mwdat-inputs", version.ref = "mwdat" }
mwdat-mockdevice = { module = "com.meta.wearable:mwdat-mockdevice", version.ref = "mwdat" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
onnxruntime-android = { module = "com.microsoft.onnxruntime:onnxruntime-android", version.ref = "onnxAndroid" }
# tensorflow-lite (pas com.google.ai.edge.litert:litert:2.3.x : son litert-api est
# en metadata Kotlin 2.4, illisible par le Kotlin 2.2 du projet). Même API
# org.tensorflow.lite.Interpreter, Java pur.
litert = { module = "org.tensorflow:tensorflow-lite", version.ref = "litert" }
# Délégué GPU classique (TwinLiteNet : graphe taillé GPU, 270/270 nœuds délégués).
# Les deux artefacts : `-gpu` seul ne tire pas les classes `GpuDelegateFactory`.
litert-gpu = { module = "org.tensorflow:tensorflow-lite-gpu", version.ref = "litert" }
litert-gpu-api = { module = "org.tensorflow:tensorflow-lite-gpu-api", version.ref = "litert" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
