# Déploiement du relais iSee (Worker + D1 + salle temps réel).
#
# `deploy.json` décrit les modules au service d'hébergement utilisé jusqu'ici ; ce
# fichier-ci est la source de vérité pour `wrangler deploy`, qui est le seul moyen
# d'ajouter la **salle** (Durable Object) à un Worker déjà en ligne.
#
#   1. npx wrangler login            # le compte qui possède le worker `isee-suivi`
#   2. npx wrangler deploy           # depuis ce dossier
#
# La base liée est la D1 de production (`duello-site-track`, id ci-dessous) :
# un autre id ferait répondre 503 sur /api/state. Les assets embarquent la
# page caregiver servie en `/` : sans eux, les liens navigateur casseraient.

name = "isee-suivi"
main = "src/worker.js"
compatibility_date = "2026-10-28"

[observability]
enabled = true

# Page caregiver servie en statique (/, /live.mjs, /styles.css...) depuis le
# dossier `suivi-parent/` voisin : l'app embarque la même page dans l'APK.
[assets]
directory = "../suivi-parent"

[[durable_objects.bindings]]
name = "RELAY_ROOM"
class_name = "RelayRoom"

# Une salle par flux, en mémoire seulement : rien n'est stocké côté objet.
[[migrations]]
tag = "v1-relay-room"
new_sqlite_classes = ["RelayRoom"]

[[d1_databases]]
binding = "DB"
database_name = "duello-site-track"
# Id de production (relevé par `npx wrangler d1 list`) : un id inventé ferait
# déployer un Worker qui répond 503 sur /api/state.
database_id = "a44091c9-be16-443a-a207-257921eae3a7"
