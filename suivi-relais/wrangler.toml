# iSee relay deploy (Worker + D1 + realtime room).
#
# `deploy.json` describes the modules to the hosting service used so far; this
# file is the source of truth for `wrangler deploy`, the only way to add the
# **room** (Durable Object) to an already live Worker.
#
#   1. npx wrangler login            # the account owning the `isee-suivi` worker
#   2. npx wrangler deploy           # from this folder
#
# The bound base is the production D1 (`duello-site-track`, id below):
# another id would answer 503 on /api/state. Assets embed the
# caregiver page served at `/`: without them, browser links would break.

name = "isee-suivi"
main = "src/worker.js"
compatibility_date = "2026-10-28"

[observability]
enabled = true

# Caregiver page served statically (/, /live.mjs, /styles.css...) from the
# neighbouring `suivi-parent/` folder: the app embeds the same page in the APK.
[assets]
directory = "../suivi-parent"

[[durable_objects.bindings]]
name = "RELAY_ROOM"
class_name = "RelayRoom"

# One room per stream, memory only: nothing is stored object-side.
[[migrations]]
tag = "v1-relay-room"
new_sqlite_classes = ["RelayRoom"]

[[d1_databases]]
binding = "DB"
database_name = "duello-site-track"
# Production id (read by `npx wrangler d1 list`): an invented id would
# deploy a Worker answering 503 on /api/state.
database_id = "a44091c9-be16-443a-a207-257921eae3a7"
