# File de merge Mergify — BaptisteFaisy/vision
#
# Pourquoi Mergify et pas la file native de GitHub : celle-ci exige un dépôt
# public possédé par une **organisation** (« available in any public repository
# owned by an organization ») ; ce dépôt appartient à un compte utilisateur, et
# l'API refuse la règle `merge_queue` (422 « Invalid rule 'merge_queue' »).
#
# Ce que fait la file : elle met les PR en file, les met à jour contre `master`
# (`update_method: rebase`), rejoue les trois checks requis sur l'arbre fusionné
# du lot (`batch_size`), puis merge le lot en rebase (historique linéaire
# conservé). C'est la garantie que `strict_required_status_checks_policy`
# cherchait — sans relancer la CI d'une PR à chaque mouvement de `master`.
#
# Prérequis (une fois, côté dépôt) :
#   - app Mergify installée (id 10562) ;
#   - Mergify **acteur de contournement** du ruleset 25911098, mode `exempt`
#     (sinon `strict` + `pull_request` bloquent les branches de file) ;
#   - `ci.yml` et `couche0.yml` tournent sur `push` vers `mergify/merge-queue/**`.
#
# Le balayeur `pr-auto-merge.yml` ne merge plus ni ne rebase quand la file est
# active : il ne garde que les conflits (`DIRTY`) et les relances de panne.

queue_rules:
  - name: default
    queue_conditions:
      # Les trois checks requis par le ruleset. Une PR n'entre en file
      # qu'une fois verte : la file ne sert pas à tester, elle sert à merger
      # proprement sur une base à jour.
      - check-success = ci
      - check-success = ci-budget
      - check-success = couche0
      - base = master
      - -draft
      - -conflict
    # Lot de 3 : trois PR mergées pour un seul passage de CI.
    batch_size:
      min: 1
      max: 3
    batch_max_wait_time: 20 seconds
    merge_method: rebase
    update_method: rebase
    checks_timeout: 20 min
    max_checks_retries: 1

merge_queue:
  # 8 lots testés en parallèle (demande user du 29/10 : « pousse à 8 »).
  # Pool : 21 runners self-hosted. Par lot, un seul job lourd (`ci`, ~40 s) et
  # des jobs courts (`ci-budget` 9 s, `couche0` 7 s) ; le doublon `pull_request`
  # sur la branche de lot ne rejoue plus Gradle (cf. `ci.yml`, pas « Cette PR
  # touche-t-elle du code ? »). 8 lots ≈ 8 jobs lourds simultanés, très en
  # dessous des 21 créneaux : le reste du pool garde la CI des PR, qui est la
  # porte d'entrée de la file.
  #
  # `mode` et `max_parallel_checks` sont des options de la FILE : les mettre
  # dans une règle de `queue_rules` est refusé par le schéma Mergify
  # (« Additional properties are not allowed »). C'était le cas dans
  # BaptisteFaisy/isee, corrigé ici au bon niveau.
  #
  # isolated (2026-10-29) : chaque lot est testé seul contre `master`, sans
  # dépendance aux autres lots — les 8 lots ne s'attendent plus. Contrepartie
  # assumée : plus de test cumulatif, deux PR vertes séparément peuvent casser
  # `master` ensemble ; et `skip_intermediate_results` ne s'applique pas dans
  # ce mode. `parallel` (dépendances par scopes) demanderait un bloc `scopes:`
  # que ce dépôt n'a pas, et `fast-forward` est interdit ici — on merge en
  # `rebase`, donc compatible.
  mode: isolated
  max_parallel_checks: 8

priority_rules:
  - name: urgent
    conditions:
      - label = urgent
    priority: high
  - name: priority-low
    conditions:
      - label = priority-low
    priority: low

# Mise en file automatique : dépend du produit « Merge Protections », un
# second produit Mergify. Vérifié le 29/10 : laissé à `true` sans activation,
# il ne met rien en file. La mise en file effective est donc faite par le
# balayeur (`pr-auto-merge.yml`), qui commente `@mergifyio queue` sur chaque PR
# verte — une commande ne dépend d'aucun produit.
merge_protections_settings:
  auto_merge_conditions: true
